version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smarthost_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata-core:/var/lib/postgresql/data

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: smarthost_users
    ports:
      - "3306:3306"
    volumes:
      - mysqldata-users:/var/lib/mysql

  users-service:
    build:
      context: ./backend-users
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=smarthost_users
      - DB_PORT=3306
    depends_on:
      - mysql-db
    volumes:
      - ./backend-users:/app

  core-service:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres-db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=smarthost_core
      - DB_PORT=5432
    depends_on:
      - postgres-db
    volumes:
      - ./backend-core:/app

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - mysql-db

volumes:
  pgdata-core:
  mysqldata-users:
